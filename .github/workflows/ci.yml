name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --affected compares against the PR base automatically; on main, against the previous push.
      - if: github.event_name == 'push'
        run: echo "TURBO_SCM_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --affected

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --affected compares against the PR base automatically; on main, against the previous push.
      - if: github.event_name == 'push'
        run: echo "TURBO_SCM_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
      - run: pnpm --filter berghald exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --affected
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sites/*/playwright-report
          retention-days: 7

  deploy:
    name: Deploy changed sites
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --affected compares against the PR base automatically; on main, against the previous push.
      - if: github.event_name == 'push'
        run: echo "TURBO_SCM_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
      # Each site's `deploy` script applies D1 migrations, then runs `wrangler deploy`.
      # A change in packages/* redeploys every site that depends on it.
      - run: pnpm turbo run deploy --affected
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
