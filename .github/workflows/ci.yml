name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # --affected compares against this. On a PR, the base commit (a bare `main` doesn't exist
  # in the checkout, so turbo would assume everything changed); on main, the previous push.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Docs-only changes (*.md) skip lint/typecheck/test/build, e2e and deploy.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check

  check:
    name: Lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      - run: pnpm turbo run lint typecheck test build --affected

  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Browsers and their system libraries come with the image. Installing them with apt took
    # up to 13 minutes a run. Bump the tag together with @playwright/test; the step below
    # fails if they differ.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The container runs as root on a checkout owned by another user.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the image matches @playwright/test
        run: |
          version=$(pnpm --filter berghald exec playwright --version | awk '{print $2}')
          test "$version" = "1.65.1" || { echo "::error::@playwright/test is $version; update the e2e container tag"; exit 1; }
      # Local mode for e2e: no Access check, no page cache (the build bundles .dev.vars).
      # .dev.vars is a turbo input, so this build never shares a cache entry with a deploy build.
      - run: cp sites/berghald/.dev.vars.example sites/berghald/.dev.vars
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ github.sha }}
          restore-keys: turbo-e2e-
      - run: pnpm turbo run test:e2e --affected
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sites/*/playwright-report
          retention-days: 7

  preview:
    name: Preview deploy
    needs: changes
    # Fork PRs get no secrets, so they get no preview.
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-preview-${{ github.sha }}
          restore-keys: turbo-preview-
      # Builds for wrangler's "preview" env (own Worker, D1, R2), migrates its D1, and
      # uploads a version with alias pr-<n>. Production is never touched.
      - id: upload
        run: |
          set -o pipefail
          pnpm turbo run deploy:preview --filter berghald 2>&1 | tee upload.log
          url=$(grep -oE 'https://pr-[0-9]+-berghald-preview\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          if [ -z "$url" ]; then echo "::error::No preview URL in wrangler output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_ENV: preview
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # One comment per PR with the link, edited on later pushes.
      - name: Comment the preview link
        run: |
          body="**Preview:** $URL (behind Cloudflare Access) · commit ${SHA:0:7}"
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}

  deploy:
    name: Deploy changed sites
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reuses the build from the check job (same commit, no .dev.vars).
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      # Each site's `deploy` script applies D1 migrations, then runs `wrangler deploy`.
      # A change in packages/* redeploys every site that depends on it.
      - run: pnpm turbo run deploy --affected
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Source map upload before deploy (sites/<name>/scripts/sourcemaps.sh).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Catches a live site that deployed but is broken, e.g. cached HTML linking deleted assets.
      - name: Smoke test berghald
        run: sites/berghald/scripts/smoke.sh https://berghald.eythorkonrads.com
